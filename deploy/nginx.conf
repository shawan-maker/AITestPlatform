# ============================================================================
# AITestPlatform Nginx 配置
#
# 使用方法:
#   1. 将此文件复制到 /etc/nginx/conf.d/ 或 /etc/nginx/sites-enabled/
#   2. 修改下方 server_name 为实际域名
#   3. 修改 root 指向前端 dist 目录的实际路径
#   4. 修改 proxy_pass 中的后端地址
#   5. nginx -t && nginx -s reload
# ============================================================================

upstream backend {
    # 后端 uvicorn 地址，与 .env 中的 BACKEND_HOST/BACKEND_PORT 对应
    server 127.0.0.1:8000;
}

server {
    listen 80;
    # 替换为实际域名或服务器 IP
    server_name your-domain.com;

    # 前端静态文件目录（npm run build 的输出目录）
    root /opt/aitestplatform/frontend/dist;
    index index.html;

    # -----------------------------------------------------------------------
    # Gzip 压缩（减少静态资源传输体积）
    # -----------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # -----------------------------------------------------------------------
    # 安全 Headers
    # -----------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # -----------------------------------------------------------------------
    # API 反向代理（所有 /api/ 请求转发到后端）
    # -----------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置（AI 生成可能耗时较长）
        proxy_connect_timeout 60s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # 文件上传大小限制（与后端 MAX_UPLOAD_BYTES 对应）
        client_max_body_size 20m;
    }

    # -----------------------------------------------------------------------
    # SSE 流式接口专用配置
    # AI 智能体生成用例使用 Server-Sent Events 流式推送
    # 必须关闭 Nginx 缓冲，否则事件会被攒在一起延迟推送
    # -----------------------------------------------------------------------
    location /api/v1/ai-generation/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # === SSE 关键配置 ===
        proxy_buffering off;          # 关闭响应缓冲，事件即时推送
        proxy_cache off;              # 禁用缓存
        chunked_transfer_encoding on; # 支持分块传输

        # SSE 超时（智能体 Agent 默认 600s 超时）
        proxy_connect_timeout 60s;
        proxy_read_timeout 700s;
        proxy_send_timeout 700s;

        client_max_body_size 20m;
    }

    # -----------------------------------------------------------------------
    # 健康检查端点（供监控系统 / 负载均衡器使用）
    # -----------------------------------------------------------------------
    location /health {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        access_log off;
    }

    # -----------------------------------------------------------------------
    # 前端静态资源（带缓存策略）
    # -----------------------------------------------------------------------
    # Vite 构建的带 hash 资源，长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # -----------------------------------------------------------------------
    # Vue Router History 模式 - SPA 路由回退
    # 所有未匹配到的路径都回退到 index.html，由前端路由处理
    # -----------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}

